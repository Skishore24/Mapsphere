server:
  port: ${PORT:8081}

spring:
  application:
    name: mapsphere
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mapsphere}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in ms

mapsphere:
  seed:
    enabled: ${SEED_ENABLED:true}
  security:
    cors:
      allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
  websocket:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:3000}
  geocoding:
    nominatim-url: ${GEOCODING_URL:https://nominatim.openstreetmap.org}
    user-agent: ${GEOCODING_USER_AGENT:MapSphere-Platform/1.0 (production-mapsphere@local.dev)}
  routing:
    osrm-url: ${ROUTING_URL:https://router.project-osrm.org}
