server:
  port: 8081

spring:
  application:
    name: mapsphere
  # Exclude DataSource/Hibernate autoconfiguration in Phase 2
  # until PostgreSQL & PostGIS are configured in Phase 3
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
